[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "biped-rl"
version = "0.7.0"
description = "Reinforcement learning for Juan, a small servo-driven biped, in MuJoCo"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "gymnasium>=1.0",
    "stable-baselines3>=2.3",
    "torch",
    "tensorboard",
    "imageio",
    "imageio-ffmpeg",
    "moviepy<2",  # TensorBoard videos (torch needs moviepy.editor)
]

[tool.setuptools.packages.find]
include = ["biped_rl*"]
