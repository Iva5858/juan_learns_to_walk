# pre-commit install   (then these run on every commit; pre-commit run --all-files to run them now)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files   # meshes and policies are added on purpose; videos and runs are not
        args: ["--maxkb=8000"]
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
